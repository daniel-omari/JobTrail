[project]
name = "jobtrail"
version = "0.1.0"
description = "Local-first, privacy-first job application tracker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobtrail*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ollama: needs a running local Ollama with the chosen model (run with -m ollama)"]
addopts = "-m 'not ollama'"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:.*httpx2.*"]
