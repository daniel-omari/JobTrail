name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests, privacy benchmark, dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -e ".[dev]" pip-audit
      - name: Tests (canary, egress guard, gate, detector, defence demo with a stub model)
        run: pytest -q
      - name: Recall / privacy benchmark (rules-only; CI has no local model)
        run: python scripts/benchmark.py
      - name: Audit Python dependencies
        run: pip-audit --skip-editable

  frontend:
    name: Frontend build and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
